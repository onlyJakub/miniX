services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minix}
      POSTGRES_USER: ${POSTGRES_USER:-minix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: host=db
      PGDATABASE: ${POSTGRES_DB:-minix}
      PGUSER: ${POSTGRES_USER:-minix}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
      JWT_SECRET: ${JWT_SECRET:?Ustaw JWT_SECRET w pliku .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      COOKIE_SECURE: "false"
      AUTH_ORIGINS: "http://localhost:${MINIX_PORT:-8080},http://127.0.0.1:${MINIX_PORT:-8080}"
      AI_MODERATION_ENABLED: "${AI_MODERATION_ENABLED:-true}"
      AI_BASE_URL: "${AI_BASE_URL:-http://host.docker.internal:1234}"
      AI_MODEL: "${AI_MODEL:-basal-omni-1.0-mini}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${MINIX_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data: