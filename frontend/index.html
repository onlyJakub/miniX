<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MiniX — miejsce na Twoje myśli i codzienne rozmowy." />
    <title>Witaj w MiniX</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body data-page="welcome">
    <main class="welcome-page">
      <section id="session-screen" class="session-screen" aria-label="Sprawdzanie sesji" aria-busy="true">
        <p class="brand"><span class="brand-icon" aria-hidden="true">m</span><span>Mini<span class="brand-accent">X</span></span></p>
        <p id="session-status" class="message" role="status" aria-live="polite">Sprawdzanie sesji…</p>
        <button id="retry-session" type="button" class="mt-5" hidden>Spróbuj ponownie</button>
      </section>
      <div id="page-content" class="welcome-grid" hidden>
        <div class="welcome-art">
          <p class="welcome-mark">Mini<span class="brand-accent">X</span></p>
        </div>
        <section class="welcome-intro" aria-labelledby="welcome-heading">
          <h1 id="welcome-heading">Tu zaczyna się rozmowa.</h1>
          <p class="welcome-description">Podziel się myślą i zobacz, co słychać u innych.</p>
          <nav class="welcome-actions" aria-label="Dołącz do MiniX">
            <a class="button-link" href="/login">Zaloguj się</a>
            <a class="button-link button-secondary" href="/register">Utwórz konto</a>
          </nav>
        </section>
      </div>
    </main>
  </body>
</html>
