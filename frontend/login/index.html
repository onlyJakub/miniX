<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logowanie — MiniX</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body data-page="login">
    <main class="auth-page">
      <section id="session-screen" class="session-screen" aria-label="Sprawdzanie sesji" aria-busy="true">
        <p class="brand"><span class="brand-icon" aria-hidden="true">m</span><span>Mini<span class="brand-accent">X</span></span></p>
        <p id="session-status" class="message" role="status" aria-live="polite">Sprawdzanie sesji…</p>
        <button id="retry-session" type="button" class="mt-5" hidden>Spróbuj ponownie</button>
      </section>
      <div id="page-content" class="auth-content" hidden>
        <a href="/" class="brand" aria-label="MiniX — strona główna"><span class="brand-icon" aria-hidden="true">m</span><span>Mini<span class="brand-accent">X</span></span></a>
        <section class="auth-card" aria-labelledby="login-heading">
          <h1 id="login-heading">Zaloguj się</h1>
          <form id="auth-form" data-action="login" class="auth-form" method="post" action="/api/auth/login">
            <div>
              <label for="identifier">Login lub e-mail</label>
              <input id="identifier" name="identifier" type="text" required maxlength="255" autocomplete="username" autocapitalize="none" spellcheck="false" />
            </div>
            <div>
              <label for="password">Hasło</label>
              <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password" />
            </div>
            <button type="submit">Zaloguj się</button>
          </form>
          <p id="form-message" class="message" role="alert" aria-live="polite"></p>
          <p class="auth-switch">Nie masz konta? <a href="/register">Utwórz konto</a></p>
        </section>
      </div>
    </main>
  </body>
</html>
