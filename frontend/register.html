<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rejestracja — MiniX</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main>
      <a href="/">← MiniX</a>
      <section class="panel" aria-labelledby="register-heading">
        <h1 id="register-heading">Utwórz konto</h1>
        <p class="hint">Wypełnij formularz, aby dołączyć do MiniX.</p>
        <form id="auth-form" data-action="register" class="mt-6 space-y-5" method="post" action="/api/auth/register">
          <div>
            <label for="username">Nazwa użytkownika</label>
            <input id="username" name="username" type="text" required minlength="3" maxlength="50" pattern="[A-Za-z0-9_]+" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="username-hint" />
            <p id="username-hint" class="hint">3–50 liter A–Z, cyfr lub znaków podkreślenia. Wielkość liter nie rozróżnia kont.</p>
          </div>
          <div>
            <label for="email">Adres e-mail</label>
            <input id="email" name="email" type="email" required maxlength="255" autocomplete="email" autocapitalize="none" spellcheck="false" />
          </div>
          <div>
            <label for="password">Hasło</label>
            <input id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password" aria-describedby="password-hint" />
            <p id="password-hint" class="hint">Od 8 do 128 znaków.</p>
          </div>
          <button type="submit">Zarejestruj się</button>
        </form>
        <p id="form-message" class="message" role="alert" aria-live="polite"></p>
        <p class="mt-6 text-sm">Masz już konto? <a href="/login.html">Zaloguj się</a></p>
      </section>
    </main>
  </body>
</html>
