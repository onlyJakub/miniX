<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logowanie — MiniX</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main>
      <a href="/">← MiniX</a>
      <section class="panel" aria-labelledby="login-heading">
        <h1 id="login-heading">Zaloguj się</h1>
        <p class="hint">Wpisz nazwę użytkownika lub adres e-mail.</p>
        <form id="auth-form" data-action="login" class="mt-6 space-y-5" method="post" action="/api/auth/login">
          <div>
            <label for="identifier">Login lub e-mail</label>
            <input id="identifier" name="identifier" type="text" required maxlength="255" autocomplete="username" autocapitalize="none" spellcheck="false" />
          </div>
          <div>
            <label for="password">Hasło</label>
            <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password" />
          </div>
          <button type="submit">Zaloguj się</button>
        </form>
        <p id="form-message" class="message" role="alert" aria-live="polite"></p>
        <p class="mt-6 text-sm">Nie masz konta? <a href="/register.html">Zarejestruj się</a></p>
      </section>
    </main>
  </body>
</html>
