<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed — MiniX</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body data-page="feed">
    <main>
      <section id="session-screen" class="session-screen" aria-label="Sprawdzanie sesji" aria-busy="true">
        <p class="brand"><span>Mini<span class="brand-accent">X</span></span></p>
        <p id="session-status" class="message" role="status" aria-live="polite">Sprawdzanie sesji…</p>
        <button id="retry-session" type="button" class="mt-5" hidden>Spróbuj ponownie</button>
      </section>
      <div id="page-content" class="feed-layout" hidden>
        <aside class="feed-sidebar">
          <a href="/" class="brand sidebar-brand" aria-label="MiniX — strona główna"><span>Mini<span class="brand-accent">X</span></span></a>
          <nav class="sidebar-nav" aria-label="Główna nawigacja">
            <button id="nav-home" class="sidebar-button" type="button" aria-current="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
              <span>Strona główna</span>
            </button>
            <button id="new-post" class="sidebar-button new-post" type="button" aria-controls="post-composer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              <span>Nowy post</span>
            </button>
          </nav>
          <div class="sidebar-account" aria-label="Twoje konto" role="group">
            <div class="account-row">
              <span id="account-avatar" class="avatar" aria-hidden="true"></span>
              <div class="account-identity">
                <p id="current-username" class="account-name"></p>
                <p id="current-email" class="account-email"></p>
              </div>
              <button id="logout" class="feed-icon-button" type="button" aria-label="Wyloguj się" title="Wyloguj się">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5m4-12 4 4-4 4m-5-4h9"/></svg>
              </button>
            </div>
            <p id="logout-message" class="message" data-kind="error" role="alert"></p>
          </div>
        </aside>

        <div class="feed-column">
          <header class="feed-header">
            <h1 id="feed-title">Strona główna</h1>
            <button id="refresh-posts" class="feed-icon-button" type="button" aria-label="Odśwież feed" title="Odśwież feed">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5m5 0a8 8 0 1 0-2 5.3"/></svg>
            </button>
          </header>
          <div class="feed-tabs" role="tablist" aria-label="Widok feedu">
            <button id="for-you-tab" class="feed-tab" type="button" role="tab" aria-selected="true" aria-controls="feed">Dla Ciebie</button>
            <button id="trending-tab" class="feed-tab" type="button" role="tab" aria-selected="false" aria-controls="feed" tabindex="-1">Popularne</button>
          </div>
          <section id="feed" role="tabpanel" aria-labelledby="for-you-tab">
            <section id="post-composer" class="composer" aria-label="Publikowanie posta" hidden>
              <span id="composer-avatar" class="avatar" aria-hidden="true"></span>
              <form id="post-form" novalidate>
                <label for="post-content" class="sr-only">Treść posta</label>
                <textarea id="post-content" name="content" rows="2" required placeholder="Co masz na myśli?" aria-describedby="post-counter-status"></textarea>
                <div class="composer-footer">
                  <label for="post-anonymous" class="anonymous-option">
                    <input id="post-anonymous" name="is_anonymous" type="checkbox" class="anonymous-checkbox" />
                    <span>Opublikuj anonimowo</span>
                  </label>
                  <div class="composer-actions">
                    <p id="post-counter-status" class="post-counter" role="status" aria-atomic="true">
                      <span class="sr-only">Pozostało znaków</span>
                      <span id="post-counter">280</span>
                    </p>
                    <button id="publish-post" type="submit" disabled>Opublikuj</button>
                  </div>
                </div>
                <p id="post-form-message" class="message composer-message" role="status" aria-atomic="true"></p>
              </form>
            </section>
            <p id="post-action-message" class="message feed-status" role="status" aria-atomic="true"></p>
            <h2 id="feed-heading" class="feed-list-heading trending-heading" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c4 0 7-3 7-7 0-3-2-6-4-8 0 3-1 4-2 5 0-4-1-7-4-10 .5 4-1 6-3 9-1 1.5-2 3-2 5 0 3 3 6 8 6Z"/><path d="M12 22c-2 0-3-2-3-4 0-1.5 1-3 3-5 0 2 2 3 2 5s0 3-2 4Z"/></svg>
              <span>Gorące Posty · ostatnie 24 godziny</span>
            </h2>
            <p id="feed-message" class="message feed-status" role="status" aria-atomic="true">Ładowanie postów…</p>
            <div id="post-list" aria-busy="true"></div>
            <template id="reply-thread-template">
              <p class="message reply-list-message" role="status"></p>
              <div class="reply-list"></div>
              <nav class="reply-pages" aria-label="Strony odpowiedzi" hidden>
                <button class="feed-icon-button reply-previous" type="button" aria-label="Poprzednie odpowiedzi">‹</button>
                <button class="feed-icon-button reply-next" type="button" aria-label="Następne odpowiedzi">›</button>
              </nav>
              <button class="reply-retry" type="button" hidden>Ponów pobieranie</button>
              <form class="reply-form" novalidate>
                <textarea aria-label="Treść odpowiedzi" rows="2" placeholder="Napisz odpowiedź..." required></textarea>
                <div class="composer-actions">
                  <p class="post-counter" role="status" aria-atomic="true">
                    <span class="sr-only">Pozostało znaków</span>
                    <span class="reply-counter">280</span>
                  </p>
                  <button type="submit" disabled>Odpowiedz</button>
                </div>
                <p class="message" role="status" aria-atomic="true"></p>
              </form>
            </template>
            <nav id="feed-pagination" class="feed-pagination" aria-label="Strony feedu">
              <button id="previous-page" type="button" disabled>Poprzednia</button>
              <span id="page-label" aria-live="polite">Strona 1</span>
              <button id="next-page" type="button" disabled>Następna</button>
            </nav>
          </section>
        </div>

        <aside class="trending-preview" aria-labelledby="trending-preview-title">
          <h2 id="trending-preview-title" class="trending-heading">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c4 0 7-3 7-7 0-3-2-6-4-8 0 3-1 4-2 5 0-4-1-7-4-10 .5 4-1 6-3 9-1 1.5-2 3-2 5 0 3 3 6 8 6Z"/><path d="M12 22c-2 0-3-2-3-4 0-1.5 1-3 3-5 0 2 2 3 2 5s0 3-2 4Z"/></svg>
            <span>Gorące Posty</span>
          </h2>
          <p class="preview-period">Ostatnie 24 godziny</p>
          <p id="trending-preview-message" class="message" role="status"></p>
          <ol id="trending-preview-list" class="preview-list"></ol>
        </aside>
      </div>
    </main>
  </body>
</html>
