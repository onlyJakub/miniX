server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api http://backend:8000;
        proxy_pass $api;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}